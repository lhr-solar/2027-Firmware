# Build all repo docs and publish to gh-pages (triggers GitHub "pages build and deployment").
# Today: CANspec under /canspec/. Later: MkDocs / Doxygen / etc. into the same publish_dir.
name: build-docs

on:
  push:
    branches: [canspec, main]
    paths:
      - "can/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:
    inputs:
      publish_canspec_ui_release:
        description: "Also publish a CANspec UI Release (HTML only; no JSON)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage docs site root
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          # ponytail: no MkDocs yet — drop generated/static docs under _site/ as features land

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: can/canspec-viewer/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cantools
        run: pip install -r can/canspec-viewer/requirements.txt

      - name: Install CANspec npm deps
        working-directory: can/canspec-viewer
        run: npm ci

      - name: Build CANspec UI
        working-directory: can/canspec-viewer
        run: npm run build-site

      - name: Export CANspec JSON
        working-directory: can/canspec-viewer
        run: npm run export-data:dist

      - name: Stage CANspec at /canspec
        run: |
          mkdir -p _site/canspec
          cp -R can/canspec-viewer/dist/. _site/canspec/
          test -f _site/canspec/index.html
          test -f _site/canspec/canspec-data.json

      - name: Detect CANspec UI source changes
        id: canspec_ui
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=${{ inputs.publish_canspec_ui_release }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^can/canspec-viewer/'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package CANspec UI release (HTML only)
        if: steps.canspec_ui.outputs.release == 'true'
        run: |
          mkdir -p release-canspec
          cp can/canspec-viewer/dist/index.html release-canspec/
          if [ -f can/canspec-viewer/dist/LHRs.ico ]; then
            cp can/canspec-viewer/dist/LHRs.ico release-canspec/
          fi
          python3 - <<'PY'
          from pathlib import Path
          Path("release-canspec/WHERE-JSON-GOES.txt").write_text(
              "Put canspec-data.json in THIS folder — same directory as index.html.\n"
              "\n"
              "Exact filename:\n"
              "  canspec-data.json\n"
              "\n"
              "Generate from repo DBCs (do not commit the JSON on main/canspec):\n"
              "  pip install -r can/canspec-viewer/requirements.txt\n"
              "  python3 can/canspec-viewer/export_canspec_json.py -o ./canspec-data.json\n"
              "\n"
              "Then serve this folder:\n"
              "  python3 -m http.server 4173\n"
          )
          PY

      - name: Publish CANspec UI Release
        if: steps.canspec_ui.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canspec-ui-${{ github.run_id }}
          name: CANspec UI (${{ github.sha }})
          body: |
            Built single-file CANspec viewer (no CAN data included).

            **Put `canspec-data.json` in the same folder as `index.html`.**

            Generate:
            ```bash
            pip install -r can/canspec-viewer/requirements.txt
            python3 can/canspec-viewer/export_canspec_json.py -o ./canspec-data.json
            ```

            Live docs site: Pages `/canspec/`.
          files: |
            release-canspec/index.html
            release-canspec/WHERE-JSON-GOES.txt
            release-canspec/LHRs.ico
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          keep_files: true
          commit_message: "docs: publish site"