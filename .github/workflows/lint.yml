# TODO: MAKE BOTH GATING

# Static analysis and formatting
#   clang-tidy:   gating -- rebuilds every platform test and board target with TIDY=ON;
#                 a finding listed in .clang-tidy WarningsAsErrors fails the build
#   clang-format: advisory -- reports drift against .clang-format, never fails
name: lint
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.clang-tidy'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/lint.yml'
      - '.github/actions/setup-dev-env/**'
      - '.github/scripts/gen_matrix.py'
  pull_request:
    paths:
      - 'firmware/**'
      - '.clang-tidy'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/lint.yml'
      - '.github/actions/setup-dev-env/**'
      - '.github/scripts/gen_matrix.py'

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # nix pins the clang-format version -- its output differs between releases
      - uses: ./.github/actions/setup-dev-env

      - name: Check formatting
        run: |
          # .clang-format-ignore keeps vendored trees out
          git ls-files -z '*.c' '*.h' \
            | xargs -0 -r direnv exec . clang-format --dry-run 2> format.log || true
          files=$(grep -oE '^[^:]+\.[ch]:[0-9]+:[0-9]+: warning' format.log | cut -d: -f1 | sort -u)
          count=$(printf '%s' "$files" | grep -c . || true)
          {
            echo "### clang-format (advisory)"
            if [ "$count" -eq 0 ]; then
              echo "All files match \`.clang-format\`."
            else
              echo "$count file(s) differ from \`.clang-format\`. Not enforced yet;"
              echo "run \`make format\` in the platform or board directory to fix."
              echo '```'
              echo "$files" | sed "s|^$PWD/||"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -ne 0 ]; then
            echo "::warning title=clang-format::$count file(s) differ from .clang-format (advisory, see job summary)"
          fi

  tidy-platform:
    name: clang-tidy / platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dev-env

      - name: Build all platform tests with clang-tidy
        env:
          TIDY: 'ON'
        run: direnv exec . make -C firmware/platform test-all

  discover:
    name: discover board targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: Generate matrix
        run: echo "matrix=$(python3 .github/scripts/gen_matrix.py --os ubuntu-latest)" >> "$GITHUB_OUTPUT"

  tidy-boards:
    needs: discover
    name: clang-tidy / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # build_boards.yml already fails and explains a missing entry point
      - name: Skip board without build entry point
        if: matrix.blocked != ''
        run: echo "skipped -- ${{ matrix.blocked }}"

      - uses: actions/checkout@v4
        if: matrix.blocked == ''
      - uses: ./.github/actions/setup-dev-env
        if: matrix.blocked == ''

      - name: Build ${{ matrix.name }} with clang-tidy
        if: matrix.blocked == ''
        env:
          TIDY: 'ON'
        run: direnv exec . ${{ matrix.cmd }}
