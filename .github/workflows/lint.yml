# Static analysis and formatting
#   clang-tidy:   rebuilds every platform test and board target with TIDY=ON;
#                 a finding listed in .clang-tidy WarningsAsErrors fails the build
#   clang-format: runs `make format-check` for the platform and every board;
#                 any drift from .clang-format fails the job
name: lint
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.clang-tidy'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/lint.yml'
      - '.github/actions/setup-dev-env/**'
      - '.github/scripts/gen_matrix.py'
  pull_request:
    paths:
      - 'firmware/**'
      - '.clang-tidy'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/lint.yml'
      - '.github/actions/setup-dev-env/**'
      - '.github/scripts/gen_matrix.py'

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # nix pins the clang-format version -- its output differs between releases
      - uses: ./.github/actions/setup-dev-env
      - name: Check formatting
        run: |
          : > format.log
          failed=""
          for dir in firmware/platform $(dirname firmware/*/*/Board.cmake); do
            echo "::group::format-check $dir"
            if ! direnv exec . make -C "$dir" format-check 2>&1 | tee -a format.log; then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done

          files=$(grep -oE '^[^:]+\.[ch]:[0-9]+:[0-9]+: error: code should be clang-formatted' format.log \
            | cut -d: -f1 | sed "s|^$PWD/||" | sort -u || true)  # no matches is the clean case
          {
            echo "### clang-format"
            if [ -z "$failed" ]; then
              echo "All files match \`.clang-format\`."
            else
              echo "\`make format-check\` failed in:$failed"
              echo
              echo "Run \`make format\` in each of those directories and commit the result."
              echo '```'
              echo "$files"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ]; then
            echo "::error title=clang-format::make format-check failed in:$failed (see job summary)"
            exit 1
          fi

  tidy-platform:
    name: clang-tidy / platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dev-env

      - name: Build all platform tests with clang-tidy
        env:
          TIDY: 'ON'
        run: direnv exec . make -C firmware/platform test-all

  discover:
    name: discover board targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: Generate matrix
        run: echo "matrix=$(python3 .github/scripts/gen_matrix.py --os ubuntu-latest)" >> "$GITHUB_OUTPUT"

  tidy-boards:
    needs: discover
    name: clang-tidy / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # build_boards.yml already fails and explains a missing entry point
      - name: Skip board without build entry point
        if: matrix.blocked != ''
        run: echo "skipped -- ${{ matrix.blocked }}"

      - uses: actions/checkout@v4
        if: matrix.blocked == ''
      - uses: ./.github/actions/setup-dev-env
        if: matrix.blocked == ''

      - name: Build ${{ matrix.name }} with clang-tidy
        if: matrix.blocked == ''
        env:
          TIDY: 'ON'
        run: direnv exec . ${{ matrix.cmd }}
